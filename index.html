<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ranjana's Smart Home</title>

<!-- Google Sans Code font -->
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:wght@400;500;600&display=swap" rel="stylesheet">

<!-- PWA manifest -->
<link rel="manifest" href="manifest.json">

<!-- Scripts -->
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://twemoji.maxcdn.com/v/latest/twemoji.min.js"></script>

<style>
body{font-family:'Roboto',sans-serif;background:#0f172a;color:white;margin:0;text-align:center;}
.header{background:#1e293b;padding:15px;margin:10px;border-radius:12px;}
.header h2{font-family:'Google Sans Code',sans-serif;font-weight:600;font-size:28px;}
.updateBtn{background:none;border:none;color:#22c55e;font-size:18px;cursor:pointer;margin-left:6px;}
.room{background:#1e293b;margin:15px;padding:15px;border-radius:12px;}
.device{display:flex;align-items:center;justify-content:space-between;background:#334155;padding:10px;margin:8px 0;border-radius:10px;transition:0.3s;}
.device.on{background:#1e3a2f;box-shadow:0 0 10px #22c55e;}
.modeTabs{

display:flex;
justify-content:center;
gap:10px;
margin:10px;

}

.modeBtn{

background:#334155;
color:white;
border:none;
padding:10px 18px;
border-radius:10px;
cursor:pointer;
font-size:14px;

}

.modeBtn.active{

background:#22c55e;

}

#wifiStatusBox,
#bleStatusBox{

margin-top:8px;

}
.icon{font-size:22px;width:30px;}
.device.on .fan{animation:spin 1s linear infinite;}
.fanPanel{
max-height:0;
overflow:hidden;
transition:max-height 0.35s ease;
background:#020617;
margin-top:-6px;
margin-bottom:10px;
border-radius:10px;
padding:0 10px;
box-sizing:border-box;
}

.fanPanel input[type=range]{

width:95%;

margin:12px 0;

accent-color:#22c55e;

}

/* Arrow rotate */

.fanArrow{

transition:transform 0.3s ease;

}

.fanArrow.open{

transform:rotate(180deg);

}
.device.on .light{animation:glow 1.5s infinite alternate;}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes glow{from{text-shadow:0 0 5px #fff}to{text-shadow:0 0 20px yellow}}
.toggle{position:relative;width:50px;height:26px;}
.toggle input{display:none;}
.slider{position:absolute;cursor:pointer;background:#64748b;border-radius:34px;top:0;left:0;right:0;bottom:0;}
.slider:before{position:absolute;content:"";height:20px;width:20px;left:3px;bottom:3px;background:white;border-radius:50%;transition:0.3s;}
input:checked + .slider{background:#22c55e;}
input:checked + .slider:before{transform:translateX(24px);}
.timerCircle{width:42px;height:42px;border-radius:50%;background:conic-gradient(#22c55e 0deg,#1e293b 0deg);display:flex;align-items:center;justify-content:center;font-size:10px;}
.iconBtn{background:none;border:none;font-size:18px;color:white;cursor:pointer;}
#voicePopup{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#1e293b;padding:20px 30px;border-radius:12px;font-size:20px;display:none;z-index:1000;font-family:'Google Sans Code',sans-serif;}
.mic{position:fixed;bottom:30px;right:30px;width:60px;height:60px;border-radius:50%;background:#22c55e;font-size:28px;border:none;color:white;cursor:pointer;}
.wave{position:fixed;bottom:30px;right:30px;width:60px;height:60px;border-radius:50%;background:#22c55e;opacity:0.3;animation:wave 2s infinite;display:none;}
.wave:nth-child(2){animation-delay:0.5s}
.wave:nth-child(3){animation-delay:1s}
@keyframes wave{0%{transform:scale(1);opacity:0.5}100%{transform:scale(2.5);opacity:0}}
img.emoji{height:20px;width:20px;vertical-align:middle;}
</style>
</head>
<body>

<div class="header">
<h2>🏠 Ranjana's Smart Home</h2>
<button class="updateBtn" onclick="requestStatus()">🔄</button>
</div>

<!-- MODE TABS -->
<div class="modeTabs">

<button class="modeBtn active"
id="wifiTab"
onclick="setMode('wifi')">
📶 WiFi Mode
</button>

<button class="modeBtn"
id="bleTab"
onclick="setMode('ble')">
🔵 Bluetooth Mode
</button>

</div>

<!-- Status Areas -->
<div id="wifiStatusBox">

MQTT:
<span id="mqttStatus">Connecting...</span><br>

WiFi:
<span id="wifiSSID">--</span>

Signal:
<span id="wifiRSSI">--</span>

</div>

<div id="bleStatusBox" style="display:none">

Bluetooth:
<span id="bleStatus">Disconnected</span>

</div>

<div id="rooms"></div>
<h3>Room 1 Usage</h3>
<canvas id="usageChart1" width="350" height="200"></canvas>

<h3>Room 2 Usage</h3>
<canvas id="usageChart2" width="350" height="200"></canvas>

<div id="voicePopup">Listening...</div>
<div class="wave"></div><div class="wave"></div><div class="wave"></div>
<button class="mic" onclick="startVoice()">🎤</button>

<script>
twemoji.parse(document.body)

// --- MQTT ---
const broker="wss://5dba91287f8248c1a30195053d3862ed.s1.eu.hivemq.cloud:8884/mqtt"
const topicCmd="home/esp32/commands"
let client = null;

// UNIVERSAL COMMAND SENDER
function sendCommand(cmd){

if(!cmd) return;


// ---------- WIFI MODE ----------

if(currentMode === "wifi"){

if(client && client.connected){

client.publish(
topicCmd,
cmd
);

}
else{

console.log(
"MQTT not connected, command skipped:",
cmd
);

}

}


// ---------- BLE MODE ----------

else if(currentMode === "ble"){

if(bleWriteChar){

sendBLECommand(cmd);

}
else{

console.log(
"BLE not ready, command skipped:",
cmd
);

}

}

}
let usageData=new Array(8).fill(0)
let timers=new Array(8).fill(0)
let timerTotal=new Array(8).fill(0)
let lastRoom=null,lastDeviceType=null
const deviceNames=["Light","Fan","Tube","Socket","Light","Fan","Bulb","Socket"]
const icons=["💡","🌀","💡","🔌","💡","🌀","💡","🔌"]
const roomsDiv=document.getElementById("rooms")

// --- Create rooms ---
for(let i=0;i<8;i++){

let room=i<4?1:2

let roomDiv=document.getElementById("room"+room)

if(!roomDiv){

roomDiv=document.createElement("div")

roomDiv.className="room"

roomDiv.id="room"+room

roomDiv.innerHTML="<h3>Room "+room+"</h3>"

roomsDiv.appendChild(roomDiv)

}

let iconClass=(i==1||i==5)?"fan":"light"

let controlHTML="";

let extraPanel="";

// --- FAN DEVICES ---
if(i==1 || i==5){

let fanRoom=(i==1)?1:2;

// Fan toggle + arrow
controlHTML=`

<label class="toggle">

<input type="checkbox" data-id="${i}">

<span class="slider"></span>

</label>

<button class="iconBtn fanArrow"
id="fanArrow${fanRoom}"
onclick="toggleFanPanel(${fanRoom})">

▼

</button>

`;

// Separate sliding panel (OUTSIDE device)
extraPanel=`

<div class="fanPanel"
id="fanPanel${fanRoom}">

<input type="range"
min="0"
max="4"
step="1"
value="0"

oninput="
setFanSpeed(${fanRoom},this.value);
this.nextElementSibling.innerText='Speed: '+this.value;
">

<div style="
font-size:12px;
color:#94a3b8;
margin-bottom:8px;
">
Speed: 0
</div>

</div>

`;

}

// --- NORMAL DEVICES ---
else{

controlHTML=`

<label class="toggle">

<input type="checkbox" data-id="${i}">

<span class="slider"></span>

</label>

`;

}

// --- DEVICE CARD ---
roomDiv.innerHTML+=`

<div class="device">

<div class="icon ${iconClass}">
${icons[i]}
</div>

<div>
${deviceNames[i]}
</div>

<div class="timerCircle"
id="circle${i}">
<span id="timer${i}"></span>
</div>

${controlHTML}

<button class="iconBtn"
onclick="setTimer(${i})">
⏱
</button>

<button class="iconBtn"
onclick="showUsage(${i})">
📊
</button>

</div>

${extraPanel}

`

}
// ---------- DEVICE SWITCH HANDLERS ----------

// Only attach to checkboxes (NOT sliders)
document.querySelectorAll(
"input[type='checkbox']"
).forEach(el=>{

el.onchange=()=>{

if(!el.dataset.id) return;

sendCommand(
el.dataset.id +
(el.checked ? "1" : "0")
);

};

});





function requestStatus(){

sendCommand("status");

}



// ---------- PARSE DATA FROM ESP ----------

function parseData(msg){

if(!msg) return;


// ---------- FAN SPEED UPDATE ----------

if(msg.startsWith("F")){

let p =
msg.substring(1).split(",");

let f1 =
parseInt(p[0] ?? 0) || 0;

let f2 =
parseInt(p[1] ?? 0) || 0;


// Room 1
let panel1 =
document.getElementById("fanPanel1");

if(panel1){

let slider1 =
panel1.querySelector(
"input[type='range']"
);

let label1 =
panel1.querySelector("div");

if(slider1){

slider1.value = f1;

}

if(label1){

label1.innerText =
"Speed: " + f1;

}

}


// Room 2
let panel2 =
document.getElementById("fanPanel2");

if(panel2){

let slider2 =
panel2.querySelector(
"input[type='range']"
);

let label2 =
panel2.querySelector("div");

if(slider2){

slider2.value = f2;

}

if(label2){

label2.innerText =
"Speed: " + f2;

}

}

return;

}



// ---------- WIFI STATUS ----------

if(msg.startsWith("S")){

let p = msg.split(",");

if(p.length >= 2){

let ssid =
p[0].substring(1);

let rssi =
p[1].substring(1);

document.getElementById("wifiSSID")
.innerText = ssid;

document.getElementById("wifiRSSI")
.innerText = rssi + " dBm";

}

return;

}



// ---------- RELAY + TIMER DATA ----------

let offset =
msg.startsWith("a:")
? 0
: 4;

let parts =
msg.split(",");

if(parts.length < 9) return;


// Relay states
let r =
parts[0].substring(3);

for(let i=0;i<4;i++){

let id =
offset + i;

let sw =
document.querySelector(
'input[data-id="'+id+'"]'
);

if(sw){

let state =
(r[i] === "1");

sw.checked = state;

let deviceCard =
sw.closest(".device");

if(deviceCard){

deviceCard.classList
.toggle("on",state);

}

}

}



// Timer values
for(let i=0;i<4;i++){

let id =
offset + i;

let m =
parseInt(
parts[i+1]
.replace("T","")
) || 0;

let seconds =
m * 60;


// Only update if changed
if(seconds > 0){

if(timers[id] !== seconds){

timers[id] = seconds;

timerTotal[id] =
seconds;

}

}
else{

timers[id] = 0;

timerTotal[id] = 0;

}

}



// Usage data
for(let i=0;i<4;i++){

let id =
offset + i;

usageData[id] =
parseInt(
parts[i+5]
.replace("U","")
) || 0;

}


updateGraphs();

}



// ---------- USAGE POPUP ----------

function showUsage(id){

alert(
deviceNames[id] +
" Usage: " +
usageData[id] +
" minutes"
);

}



// ---------- TIMER SET ----------

function setTimer(id){

let m =
parseInt(
prompt("Timer minutes")
);

if(
isNaN(m) ||
m <= 0
) return;

sendCommand(
"T" + id + m
);

}



// ---------- TIMER DISPLAY ----------

let timerEls=[];
let circleEls=[];

for(let i=0;i<8;i++){

timerEls[i]=
document.getElementById(
"timer"+i
);

circleEls[i]=
document.getElementById(
"circle"+i
);

}



// ---------- TIMER LOOP ----------

setInterval(()=>{

for(let i=0;i<8;i++){

if(timers[i] > 0){

timers[i]--;


// Format time
let m =
Math.floor(
timers[i]/60
);

let s =
timers[i] % 60;

if(s < 10)
s = "0"+s;


// Update display
if(timerEls[i]){

timerEls[i].innerText =
m + ":" + s;

}


// Update circle
if(
timerTotal[i] > 0 &&
circleEls[i]
){

let progress =
(timers[i] /
timerTotal[i]) * 360;

circleEls[i].style.background =
"conic-gradient(#22c55e " +
progress +
"deg,#1e293b 0deg)";

}


// Timer finished
if(
timers[i] === 0 &&
timerTotal[i] > 0
){

speak(
deviceNames[i] +
" timer ended"
);

// Prevent repeat speech
timerTotal[i] = 0;

}

}

}

},1000);

// ---------- CHART VARIABLES ----------

let usageChart1 = null;
let usageChart2 = null;


// ---------- INITIALIZE CHARTS ----------

function initCharts(){

let canvas1 =
document.getElementById("usageChart1");

let canvas2 =
document.getElementById("usageChart2");

if(!canvas1 || !canvas2){

console.log("Chart canvas not ready");

return;

}


// Room 1 Chart
usageChart1 = new Chart(canvas1,{

type:"bar",

data:{

labels:[
"Light",
"Fan",
"Tube",
"Socket"
],

datasets:[{

label:"Room 1 Usage (min)",

data:usageData.slice(0,4),

backgroundColor:[

"#22c55e",
"#3b82f6",
"#f59e0b",
"#ef4444"

]

}]

},

options:{

responsive:true,

animation:false,   // ⭐ improves speed

scales:{

y:{

beginAtZero:true,

title:{

display:true,

text:"Minutes Used"

}

}

}

}

});


// Room 2 Chart
usageChart2 = new Chart(canvas2,{

type:"bar",

data:{

labels:[
"Light",
"Fan",
"Bulb",
"Socket"
],

datasets:[{

label:"Room 2 Usage (min)",

data:usageData.slice(4,8),

backgroundColor:[

"#16a34a",
"#2563eb",
"#d97706",
"#dc2626"

]

}]

},

options:{

responsive:true,

animation:false,

scales:{

y:{

beginAtZero:true,

title:{

display:true,

text:"Minutes Used"

}

}

}

}

});

}



// ---------- UPDATE GRAPHS ----------

function updateGraphs(){

// Ensure charts exist
if(!usageChart1 || !usageChart2)
return;


// Validate usageData
if(!Array.isArray(usageData))
return;


// Ensure correct length
if(usageData.length < 8)
return;


// Update safely
usageChart1.data.datasets[0].data =
usageData.slice(0,4);

usageChart2.data.datasets[0].data =
usageData.slice(4,8);


// Faster update (no animation)
usageChart1.update("none");

usageChart2.update("none");

}



// ---------- INIT AFTER PAGE LOAD ----------

window.addEventListener("load", () => {
initCharts();
connectMQTT();   // start WiFi automatically
});
// ---------- FAN PANEL CONTROL ----------

function toggleFanPanel(room){

let panel =
document.getElementById(
"fanPanel"+room
);

let arrow =
document.getElementById(
"fanArrow"+room
);

if(!panel || !arrow) return;


// Close other panels safely
["fanPanel1","fanPanel2"].forEach(id=>{

if(id !== "fanPanel"+room){

let p =
document.getElementById(id);

let a =
document.getElementById(
id.replace("Panel","Arrow")
);

if(p){

p.style.maxHeight = null;

}

if(a){

a.classList.remove("open");

}

}

});


// Toggle selected panel
if(panel.style.maxHeight &&
panel.style.maxHeight !== "0px"){

panel.style.maxHeight = null;

arrow.classList.remove("open");

}
else{

panel.style.maxHeight =
panel.scrollHeight + "px";

arrow.classList.add("open");

}

}



// ---------- FAN SPEED CONTROL ----------

function setFanSpeed(room,speed){

// Ensure valid number
speed = parseInt(speed);

if(isNaN(speed)) return;

// Clamp value (0–4)
if(speed < 0) speed = 0;
if(speed > 4) speed = 4;


// Send command safely
sendCommand(
"F" + room + speed
);

}



// Optional future use
let lastDeviceId = null;

// ---------- BLE GLOBALS ----------

let bleDevice = null;
let bleServer = null;
let bleService = null;

let bleWriteChar = null;   // TX to ESP
let bleNotifyChar = null;  // RX from ESP

let reconnectTimer = null;


// ---------- START BLE ----------

async function startBLEClient(){

try{

console.log("STEP 1: BLE start");

document.getElementById("bleStatus")
.innerText = "Connecting...";


// Request device only once
if(!bleDevice){

console.log("STEP 2: requestDevice");

bleDevice =
await navigator.bluetooth.requestDevice({

filters:[
{ namePrefix:"RanjanaSmartHome" }
],

optionalServices:[
"6e400001-b5a3-f393-e0a9-e50e24dcca9e"
]

});

console.log(
"STEP 3: device selected:",
bleDevice.name
);


// ⭐ HANDLE DISCONNECT
bleDevice.addEventListener(
'gattserverdisconnected',
onBLEDisconnected
);

}


// Connect
await connectBLE();

}
catch(e){

console.log("BLE ERROR:", e);

document.getElementById("bleStatus")
.innerText = "Connection Failed";

}

}



// ---------- CONNECT BLE ----------

async function connectBLE(){

try{

console.log("STEP 4: connecting gatt");

bleServer =
await bleDevice.gatt.connect();

console.log("STEP 5: connected");

document.getElementById("bleStatus")
.innerText = "Connected";

await setupBLECharacteristics();

}
catch(e){

console.log("Connect failed:", e);

scheduleReconnect();

}

}



// ---------- DISCONNECT HANDLER ----------

function onBLEDisconnected(){

console.log("BLE disconnected");

document.getElementById("bleStatus")
.innerText = "Disconnected";

scheduleReconnect();

}



// ---------- RECONNECT ----------

async function reconnectBLE(){

try{

console.log("BLE reconnect attempt...");

if(!bleDevice){

console.log("No stored device");

return;

}


// If already connected → stop
if(
bleDevice.gatt &&
bleDevice.gatt.connected
){

console.log("Already connected");

return;

}

document.getElementById("bleStatus")
.innerText = "Reconnecting...";

await connectBLE();

console.log("BLE reconnected");

}
catch(e){

console.log("Reconnect failed:", e);

scheduleReconnect();

}

}



// ---------- SCHEDULE RECONNECT ----------

function scheduleReconnect(){

// Prevent multiple timers
if(reconnectTimer) return;

document.getElementById("bleStatus")
.innerText = "Reconnecting...";

reconnectTimer = setTimeout(()=>{

reconnectTimer = null;

if(currentMode === "ble"){

reconnectBLE();

}

}, 2000);

}



// ---------- SETUP CHARACTERISTICS ----------

async function setupBLECharacteristics(){

try{

bleService =
await bleServer.getPrimaryService(
"6e400001-b5a3-f393-e0a9-e50e24dcca9e"
);


// Write characteristic (TX)
bleWriteChar =
await bleService.getCharacteristic(
"6e400002-b5a3-f393-e0a9-e50e24dcca9e"
);


// Notify characteristic (RX)
bleNotifyChar =
await bleService.getCharacteristic(
"6e400003-b5a3-f393-e0a9-e50e24dcca9e"
);


// Enable notifications
await bleNotifyChar.startNotifications();

bleNotifyChar.addEventListener(
"characteristicvaluechanged",
handleBLEMessage
);

console.log("BLE characteristics ready");

}
catch(e){

console.log("Setup error:", e);

scheduleReconnect();

}

}
function disconnectMQTT(){

if(client && client.connected){

client.end(true);

document.getElementById("mqttStatus")
.innerText="Disconnected";

}

}


// ---------- HANDLE INCOMING DATA ----------

function handleBLEMessage(event){

let value =
new TextDecoder()
.decode(event.target.value);

console.log("BLE RX:", value);

// Send to existing parser
parseData(value);

}



// ---------- SEND COMMAND (BLE) ----------

async function sendBLECommand(cmd){

if(!bleWriteChar){

console.log("BLE not ready");

return;

}

try{

let enc = new TextEncoder();

await bleWriteChar.writeValue(
enc.encode(cmd)
);

}
catch(e){

console.log("Write failed:", e);

scheduleReconnect();

}

}
// ---------- SPEAK FUNCTION ----------

function speak(text){

if(!text) return;

try{

let msg =
new SpeechSynthesisUtterance(text);

speechSynthesis.cancel(); // stop previous speech
speechSynthesis.speak(msg);

}
catch(e){

console.log("Speech error:", e);

}

}



// ---------- NORMALIZE VOICE ----------

function normalizeVoice(text){

if(!text) return "";

text = text.toLowerCase();

// Numbers
text = text
.replace(/\bone\b/g,"1")
.replace(/\btwo\b/g,"2");

// Common fixes
text = text
.replace(/\bof\b/g,"off")
.replace(/\bturn on\b/g,"on")
.replace(/\bturn off\b/g,"off");

return text;

}



// ---------- START VOICE ----------

function startVoice(){

// Check browser support
const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;

if(!SpeechRecognition){

alert("Voice recognition not supported in this browser");
return;

}

const rec = new SpeechRecognition();

rec.lang = "en-US";
rec.interimResults = false;
rec.maxAlternatives = 1;

let popup =
document.getElementById("voicePopup");

let waves =
document.querySelectorAll(".wave");

// Show animation
waves.forEach(w=>w.style.display="block");

popup.innerText="🎤 Listening...";
popup.style.display="block";

rec.start();


// RESULT
rec.onresult = (e)=>{

try{

let text =
e.results[0][0].transcript;

text = normalizeVoice(text);

popup.innerText = text;

voiceCommand(text);

}
catch(err){

console.log("Voice parse error:", err);

}

setTimeout(()=>{

popup.style.display="none";

},2000);

waves.forEach(w=>w.style.display="none");

};


// ERROR
rec.onerror = (e)=>{

console.log("Voice error:", e.error);

popup.innerText="Voice error";

setTimeout(()=>{

popup.style.display="none";

},1500);

waves.forEach(w=>w.style.display="none");

};


// END
rec.onend = ()=>{

waves.forEach(w=>w.style.display="none");

};
rec.stop();

}



// ---------- FULL VOICE COMMAND ENGINE ----------

function voiceCommand(cmd){

if(!cmd) return;

cmd = cmd.toLowerCase();


// ---------- DEVICE MAPS ----------

const roomMap = {

"room 1":[0,1,2,3],
"room 2":[4,5,6,7]

};

const typeMap = {

"light":[0,4,2,6],
"fan":[1,5],
"tube":[2],
"bulb":[6],
"socket":[3,7]

};


// ---------- CONTROL FUNCTION ----------

function control(ids,action){

ids.forEach(id=>{

sendCommand(
id + (action ? "1" : "0")
);

});

}


// ---------- TIMER PARSE ----------

let timerMatch =
cmd.match(/(\d+)\s*minutes?/);

let timerMinutes =
timerMatch ? parseInt(timerMatch[1]) : null;


// ---------- EXCEPT DEVICES ----------

let exceptMatch =
cmd.match(/except\s+([a-z\s,]+)/);

let exceptIds = [];

if(exceptMatch){

exceptMatch[1]
.split(",")
.map(s=>s.trim())
.forEach(t=>{

if(typeMap[t]){
