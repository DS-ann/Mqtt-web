<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ranjana's Smart Home</title>

<!-- Google Sans Code font -->
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:wght@400;500;600&display=swap" rel="stylesheet">

<!-- PWA manifest -->
<link rel="manifest" href="manifest.json">

<!-- Scripts -->
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://twemoji.maxcdn.com/v/latest/twemoji.min.js"></script>

<style>
body{font-family:'Roboto',sans-serif;background:#0f172a;color:white;margin:0;text-align:center;}
.header{background:#1e293b;padding:15px;margin:10px;border-radius:12px;}
.header h2{font-family:'Google Sans Code',sans-serif;font-weight:600;font-size:28px;}
.updateBtn{background:none;border:none;color:#22c55e;font-size:18px;cursor:pointer;margin-left:6px;}
.room{background:#1e293b;margin:15px;padding:15px;border-radius:12px;}
.device{display:flex;align-items:center;justify-content:space-between;background:#334155;padding:10px;margin:8px 0;border-radius:10px;transition:0.3s;}
.device.on{background:#1e3a2f;box-shadow:0 0 10px #22c55e;}
.icon{font-size:22px;width:30px;}
.device.on .fan{animation:spin 1s linear infinite;}
.fanPanel{

max-height:0;

overflow:hidden;

transition:max-height 0.35s ease;

background:#020617;

margin-top:-6px;

margin-bottom:10px;

border-radius:10px;

padding:0 10px;

}

.fanPanel input[type=range]{

width:95%;

margin:12px 0;

accent-color:#22c55e;

}

/* Arrow rotate */

.fanArrow{

transition:transform 0.3s ease;

}

.fanArrow.open{

transform:rotate(180deg);

}
.device.on .light{animation:glow 1.5s infinite alternate;}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes glow{from{text-shadow:0 0 5px #fff}to{text-shadow:0 0 20px yellow}}
.toggle{position:relative;width:50px;height:26px;}
.toggle input{display:none;}
.slider{position:absolute;cursor:pointer;background:#64748b;border-radius:34px;top:0;left:0;right:0;bottom:0;}
.slider:before{position:absolute;content:"";height:20px;width:20px;left:3px;bottom:3px;background:white;border-radius:50%;transition:0.3s;}
input:checked + .slider{background:#22c55e;}
input:checked + .slider:before{transform:translateX(24px);}
.timerCircle{width:42px;height:42px;border-radius:50%;background:conic-gradient(#22c55e 0deg,#1e293b 0deg);display:flex;align-items:center;justify-content:center;font-size:10px;}
.iconBtn{background:none;border:none;font-size:18px;color:white;cursor:pointer;}
#voicePopup{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#1e293b;padding:20px 30px;border-radius:12px;font-size:20px;display:none;z-index:1000;font-family:'Google Sans Code',sans-serif;}
.mic{position:fixed;bottom:30px;right:30px;width:60px;height:60px;border-radius:50%;background:#22c55e;font-size:28px;border:none;color:white;cursor:pointer;}
.wave{position:fixed;bottom:30px;right:30px;width:60px;height:60px;border-radius:50%;background:#22c55e;opacity:0.3;animation:wave 2s infinite;display:none;}
.wave:nth-child(2){animation-delay:0.5s}
.wave:nth-child(3){animation-delay:1s}
@keyframes wave{0%{transform:scale(1);opacity:0.5}100%{transform:scale(2.5);opacity:0}}
img.emoji{height:20px;width:20px;vertical-align:middle;}
</style>
</head>
<body>

<div class="header">
<h2>🏠 Ranjana's Smart Home</h2>
MQTT: <span id="mqttStatus">Connecting...</span><br>
WiFi: <span id="wifiSSID">--</span> Signal: <span id="wifiRSSI">--</span>
<button class="updateBtn" onclick="requestStatus()">🔄</button>
</div>

<div id="rooms"></div>

<h3>Room 1 Usage</h3>
<canvas id="usageChart1" width="350" height="200"></canvas>

<h3>Room 2 Usage</h3>
<canvas id="usageChart2" width="350" height="200"></canvas>

<div id="voicePopup">Listening...</div>
<div class="wave"></div><div class="wave"></div><div class="wave"></div>
<button class="mic" onclick="startVoice()">🎤</button>

<script>
twemoji.parse(document.body)

// --- MQTT ---
const broker="wss://5dba91287f8248c1a30195053d3862ed.s1.eu.hivemq.cloud:8884/mqtt"
const topicCmd="home/esp32/commands"
const client=mqtt.connect(broker,{username:"Debarghya_Sannigrahi",password:"Dsann#5956"})

let usageData=new Array(8).fill(0)
let timers=new Array(8).fill(0)
let timerTotal=new Array(8).fill(0)
let lastRoom=null,lastDeviceType=null
const deviceNames=["Light","Fan","Tube","Socket","Light","Fan","Bulb","Socket"]
const icons=["💡","🌀","💡","🔌","💡","🌀","💡","🔌"]
const roomsDiv=document.getElementById("rooms")

// --- Create rooms ---
for(let i=0;i<8;i++){

let room=i<4?1:2

let roomDiv=document.getElementById("room"+room)

if(!roomDiv){

roomDiv=document.createElement("div")

roomDiv.className="room"

roomDiv.id="room"+room

roomDiv.innerHTML="<h3>Room "+room+"</h3>"

roomsDiv.appendChild(roomDiv)

}

let iconClass=(i==1||i==5)?"fan":"light"

let controlHTML="";

let extraPanel="";

// --- FAN DEVICES ---
if(i==1 || i==5){

let fanRoom=(i==1)?1:2;

// Fan toggle + arrow
controlHTML=`

<label class="toggle">

<input type="checkbox" data-id="${i}">

<span class="slider"></span>

</label>

<button class="iconBtn fanArrow"
id="fanArrow${fanRoom}"
onclick="toggleFanPanel(${fanRoom})">

▼

</button>

`;

// Separate sliding panel (OUTSIDE device)
extraPanel=`

<div class="fanPanel"
id="fanPanel${fanRoom}">

<input type="range"
min="0"
max="4"
step="1"
value="0"

oninput="setFanSpeed(${fanRoom},this.value)">

</div>

`;

}

// --- NORMAL DEVICES ---
else{

controlHTML=`

<label class="toggle">

<input type="checkbox" data-id="${i}">

<span class="slider"></span>

</label>

`;

}

// --- DEVICE CARD ---
roomDiv.innerHTML+=`

<div class="device">

<div class="icon ${iconClass}">
${icons[i]}
</div>

<div>
${deviceNames[i]}
</div>

<div class="timerCircle"
id="circle${i}">
<span id="timer${i}"></span>
</div>

${controlHTML}

<button class="iconBtn"
onclick="setTimer(${i})">
⏱
</button>

<button class="iconBtn"
onclick="showUsage(${i})">
📊
</button>

</div>

${extraPanel}

`

}
document.querySelectorAll("input").forEach(el=>{el.onchange=()=>client.publish(topicCmd,el.dataset.id+(el.checked?"1":"0"))})

client.on("connect",()=>{ 
  document.getElementById("mqttStatus").innerText="Connected"; 
  client.subscribe("home/esp32/update"); 
  client.subscribe("home/esp32/wifi_status"); 
  requestStatus(); // Send status automatically on load
})

client.on("message",(topic,msg)=>{ parseData(msg.toString()) })

function requestStatus(){ client.publish(topicCmd,"status") }

// --- Parse data from ESP ---
function parseData(msg){
if(msg.startsWith("F")){

let p=msg.substring(1).split(",");

let f1=parseInt(p[0]??0)||0;
let f2=parseInt(p[1]??0)||0;

let fan1=document.getElementById("fanSlider1");
let fan2=document.getElementById("fanSlider2");

if(fan1)
fan1.querySelector("input").value=f1;

if(fan2)
fan2.querySelector("input").value=f2;

return;
}
if(msg.startsWith("S")){
  let p=msg.split(",")
  document.getElementById("wifiSSID").innerText=p[0].substring(1)
  document.getElementById("wifiRSSI").innerText=p[1].substring(1)+" dBm"
  return
}
let offset=msg.startsWith("a:")?0:4
let parts=msg.split(",")
let r=parts[0].substring(3)
for(let i=0;i<4;i++){
  let id=offset+i
  let sw=document.querySelector('input[data-id="'+id+'"]')
  if(sw){ let state=r[i]=="1"; sw.checked=state; sw.closest(".device").classList.toggle("on",state) }
}
for(let i=0;i<4;i++){ let id=offset+i; let m=parseInt(parts[i+1].replace("T",""))||0; if(m>0 && timers[id]===0){ timers[id]=m*60; timerTotal[id]=m*60 } if(m===0){ timers[id]=0; timerTotal[id]=0 } }
for(let i=0;i<4;i++){ let id=offset+i; usageData[id]=parseInt(parts[i+5].replace("U",""))||0 }
updateGraphs()
}

function showUsage(id){ alert(deviceNames[id]+" Usage: "+usageData[id]+" minutes") }
function setTimer(id){ let m=prompt("Timer minutes"); if(!m) return; client.publish(topicCmd,"T"+id+m) }

// --- Timer circle ---
setInterval(()=>{
for(let i=0;i<8;i++){
if(timers[i]>0){
  timers[i]--; 
  let m=Math.floor(timers[i]/60), s=timers[i]%60; if(s<10)s="0"+s
  document.getElementById("timer"+i).innerText=m+":"+s
  if(timerTotal[i]>0){ 
    let progress=(timers[i]/timerTotal[i])*360; 
    document.getElementById("circle"+i).style.background="conic-gradient(#22c55e "+progress+"deg,#1e293b 0deg)"
  }
  if(timers[i]===0 && timerTotal[i]>0) speak(deviceNames[i]+" timer ended")
}}
},1000)

// --- Charts ---
const usageChart1 = new Chart(document.getElementById("usageChart1"), {
type: "bar",
data: { labels: ["Light","Fan","Tube","Socket"], datasets: [{label:"Room 1 Usage (min)",data:usageData.slice(0,4),backgroundColor:["#22c55e","#3b82f6","#f59e0b","#ef4444"]}] },
options: { responsive:true, scales:{ y:{beginAtZero:true,title:{display:true,text:"Minutes Used"} } } }
})
const usageChart2 = new Chart(document.getElementById("usageChart2"), {
type: "bar",
data: { labels: ["Light","Fan","Bulb","Socket"], datasets: [{label:"Room 2 Usage (min)",data:usageData.slice(4,8),backgroundColor:["#16a34a","#2563eb","#d97706","#dc2626"]}] },
options: { responsive:true, scales:{ y:{beginAtZero:true,title:{display:true,text:"Minutes Used"} } } }
})
function updateGraphs(){
usageChart1.data.datasets[0].data=usageData.slice(0,4)
usageChart2.data.datasets[0].data=usageData.slice(4,8)
usageChart1.update()
usageChart2.update()
}

function toggleFanPanel(room){

let panel=document.getElementById(
"fanPanel"+room
);

let arrow=document.getElementById(
"fanArrow"+room
);

if(!panel || !arrow) return;

// Close other panels
["fanPanel1","fanPanel2"].forEach(id=>{

if(id!=="fanPanel"+room){

let p=document.getElementById(id);

let a=document.getElementById(
id.replace("Panel","Arrow")
);

if(p){

p.style.maxHeight=null;

a.classList.remove("open");

}

}

});

// Toggle selected panel
if(panel.style.maxHeight){

panel.style.maxHeight=null;

arrow.classList.remove("open");

}
else{

panel.style.maxHeight=
panel.scrollHeight+"px";

arrow.classList.add("open");

}

}
function setFanSpeed(room,speed){

client.publish(
topicCmd,
"F"+room+speed
);

}
// --- Voice ---
function speak(t){ speechSynthesis.speak(new SpeechSynthesisUtterance(t)) }
function normalizeVoice(text){
  text=text.toLowerCase()
  text=text.replace(/\bone\b/g,"1").replace(/\btwo\b/g,"2").replace(/\bof\b/g,"off")
  text=text.replace(/\bturn on\b/g,"on").replace(/\bturn off\b/g,"off")
  return text
}
function startVoice(){
  const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition
  const rec=new SpeechRecognition()
  let popup=document.getElementById("voicePopup"), waves=document.querySelectorAll(".wave")
  waves.forEach(w=>w.style.display="block")
  popup.innerText="🎤 Listening..."; popup.style.display="block"
  rec.start()
  rec.onresult=(e)=>{
    let text=e.results[0][0].transcript
    text=normalizeVoice(text)
    popup.innerText=text
    voiceCommand(text)
    setTimeout(()=>popup.style.display="none",2000)
    waves.forEach(w=>w.style.display="none")
  }
}

// --- Full AI Voice Commands ---
function voiceCommand(cmd){
  cmd=cmd.toLowerCase()
  const deviceMap={"room 1 light":0,"room 1 fan":1,"room 1 tube":2,"room 1 socket":3,"room 2 light":4,"room 2 fan":5,"room 2 bulb":6,"room 2 socket":7}
  const roomMap={"room 1":[0,1,2,3],"room 2":[4,5,6,7]}
  const typeMap={"light":[0,4,2,6],"fan":[1,5],"tube":[2],"bulb":[6],"socket":[3,7]}
  const control=(ids,action)=>ids.forEach(id=>client.publish(topicCmd,id+(action?"1":"0")))
  let m=cmd.match(/(\d+)\s*minutes?/), timerMinutes=m?parseInt(m[1]):null
  let feedback=[], except=cmd.match(/except\s+([a-z\s,]+)/), exceptIds=[]
  if(except){ except[1].split(",").map(s=>s.trim()).forEach(t=>{ if(typeMap[t]) exceptIds.push(...typeMap[t]) }) }
  let roomMention=Object.keys(roomMap).find(r=>cmd.includes(r))||lastRoom
  let typeMention=Object.keys(typeMap).find(t=>cmd.includes(t))||lastDeviceType
  if(roomMention) lastRoom=roomMention; if(typeMention) lastDeviceType=typeMention
  if(roomMention && typeMention){
    let ids=roomMap[roomMention].filter(id=>typeMap[typeMention].includes(id)).filter(id=>!exceptIds.includes(id))
    if(cmd.includes("on")){ control(ids,true); feedback.push(`${typeMention} in ${roomMention} turned on`) }
    if(cmd.includes("off")){ control(ids,false); feedback.push(`${typeMention} in ${roomMention} turned off`) }
    if(timerMinutes){ ids.forEach(id=>client.publish(topicCmd,"T"+id+timerMinutes)); feedback.push(`Timer set for ${typeMention} in ${roomMention} ${timerMinutes} minutes`) }
  }
  if(roomMention&&(cmd.includes("turn on all")||cmd.includes("turn off all")||cmd.includes("all on")||cmd.includes("all off"))){
    let ids=roomMap[roomMention].filter(id=>!exceptIds.includes(id))
    let action=cmd.includes("on")||cmd.includes("all on")
    control(ids,action); feedback.push(`${roomMention} all devices turned ${action?"on":"off"}`)
  }
  if(typeMention && !roomMention){
    let ids=typeMap[typeMention].filter(id=>!exceptIds.includes(id))
    if(cmd.includes("on")){ control(ids,true); feedback.push(`All ${typeMention} turned on`) }
    if(cmd.includes("off")){ control(ids,false); feedback.push(`All ${typeMention} turned off`) }
    if(timerMinutes){ ids.forEach(id=>client.publish(topicCmd,"T"+id+timerMinutes)); feedback.push(`Timer set for all ${typeMention} ${timerMinutes} minutes`) }
  }
  if(cmd.includes("everything")||cmd.includes("all devices")){
    let allIds=Array.from({length:8},(_,i)=>i).filter(id=>!exceptIds.includes(id))
    let action=cmd.includes("on")||cmd.includes("turn on")
    control(allIds,action)
    if(timerMinutes){ allIds.forEach(id=>client.publish(topicCmd,"T"+id+timerMinutes)); feedback.push(`Timer set for all devices ${timerMinutes} minutes`) }
    feedback.push(`All devices turned ${action?"on":"off"}`)
  }
  if(cmd.includes("status")||cmd.includes("current status")||cmd.includes("check")){ client.publish(topicCmd,"status"); feedback.push("Sending current status") }
  if(feedback.length>0) speak(feedback.join(". "))
  else speak("Command not recognized. Please specify a room or device.")
}
</script>
</body>
    </html>
